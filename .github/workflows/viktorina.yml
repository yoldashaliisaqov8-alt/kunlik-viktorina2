name: Kunlik viktorina
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  yuborish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python kunlik_viktorina.py | tee -a yuborishlar.log
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - run: |
          git config user.name "viktorina-bot"
          git config user.email "viktorina-bot@users.noreply.github.com"
          git add yuborishlar.log
          git commit -m "Kunlik viktorina yuborildi" || true
          git push
